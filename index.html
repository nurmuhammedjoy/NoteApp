<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Chrome mobile: shrink the layout viewport with the keyboard so the fixed editor stays anchored. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Note" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>Note</title>
    <script>
      // Apply the saved accent theme before first paint to avoid a flash of the default purple.
      try {
        var t = localStorage.getItem('note-color-theme')
        if (t) document.documentElement.dataset.colorTheme = t
      } catch {}
    </script>
    <link rel="stylesheet" href="%BASE_URL%fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="%BASE_URL%src/main.jsx"></script>
  </body>
</html>
